<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fce7f3">
  <title>Are You Sure? 🥺</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span>♡</span><span>✦</span><span>♡</span><span>✧</span><span>♡</span>
  </div>

  <main class="card">
    <div class="big-heart" aria-hidden="true">🥺</div>
    <h1>Wait... are you sure?</h1>
    <p class="intro">You can leave if you want to, of course. But if you're even a little curious, there's a message waiting for you. 💌</p>

    <div class="actions confirm-actions">
      <button class="button secondary" id="endButton" type="button" aria-label="Yes, end now">Yes, end now</button>
      <a class="button primary" href="index.html">No, take me back 💗</a>
    </div>
    <p class="small-note" id="playfulNote" aria-live="polite">Psst... this button is a little too shy. 😅</p>
    <a class="quiet-link" href="index.html">Return to the first page</a>
    <footer>your choice matters ♡</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
